# Runs nightly if there was a commit in the last 24 hours
name: E2E (live)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:        # allows manually triggering a run too

jobs:

# ──────────────────────────────────────────────
# JOB 1: Check for commit — checks if there was a commit in the last 24 hours
# ──────────────────────────────────────────────
  check-for-commit:
    runs-on: ubuntu-latest
    outputs:
      has_commit_today: ${{ steps.check.outputs.has_commit_today }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history to check commit dates

      - name: Check for commits in the last 24 hours
        id: check
        run: |
          COUNT=$(git log --since="24 hours ago" --oneline | wc -l)
          echo "Commits in last 24h: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "has_commit_today=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_commit_today=false" >> "$GITHUB_OUTPUT"
          fi

# ──────────────────────────────────────────────
# JOB 2: E2E live — Runs the e2e testing if there was a commit in the last 24 hours
# ──────────────────────────────────────────────

  e2e-live:
    needs: check-for-commit
    if: needs.check-for-commit.outputs.has_commit_today == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (Playwright)
        env:
          BASE_URL: ${{ secrets.E2E_BASE_URL }}
        run: npm run test:e2e:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 4